<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Share your experience</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2fbfb; --card:#fff; --ink:#0f3b44; --muted:#5b7c83;
  --brand:#14b8b0; --brand-dark:#0d8f89; --line:#d7eeee; --star:#f5b301;
}
*{box-sizing:border-box;margin:0}
html{font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);background:var(--bg)}
body{min-height:100vh;display:flex;justify-content:center;padding:20px 16px 40px;
  background:linear-gradient(180deg,#e3f7f6 0,var(--bg) 280px)}
.wrap{width:100%;max-width:440px}
.hero{text-align:center;padding:12px 0 22px}
.avatar{width:104px;height:104px;border-radius:50%;margin:0 auto 14px;background:#fff;border:3px solid #fff;
  box-shadow:0 0 0 2px var(--brand),0 8px 22px rgba(20,184,176,.25);overflow:hidden;display:grid;place-items:center}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar svg{width:52px;height:52px}
h1{font-size:1.5rem;font-weight:800;letter-spacing:-.01em}
.spec{color:var(--brand-dark);font-weight:600;font-size:.95rem;margin-top:2px}
.lead{color:var(--muted);margin-top:10px;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px 20px;
  box-shadow:0 10px 30px rgba(15,59,68,.07)}
.card h2{font-size:1.1rem;font-weight:700;text-align:center;margin-bottom:12px}
.stars{display:flex;justify-content:center;gap:6px;margin-bottom:16px}
.stars button{background:none;border:0;cursor:pointer;font-size:2.2rem;line-height:1;color:#cfe3e4;padding:2px;transition:transform .15s,color .15s}
.stars button.on{color:var(--star)}
.stars button:active{transform:scale(1.2)}
textarea{width:100%;min-height:150px;resize:vertical;border:1.5px solid var(--line);border-radius:14px;padding:14px;
  font:inherit;color:var(--ink);background:#fbfefe;outline:none;transition:border-color .2s,box-shadow .2s}
textarea:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(20,184,176,.15)}
.err{color:#c0392b;font-size:.85rem;margin-top:8px;min-height:1.2em;text-align:center}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;border-radius:14px;
  padding:16px;font:inherit;font-weight:700;font-size:1rem;cursor:pointer;text-decoration:none;transition:transform .15s,background .2s}
.btn:active{transform:scale(.98)}
.btn:focus-visible,.stars button:focus-visible,.link:focus-visible{outline:3px solid var(--brand);outline-offset:3px}
.primary{background:var(--brand);color:#fff;margin-top:8px}
.primary:hover{background:var(--brand-dark)}
.hidden{display:none}
.done{text-align:center}
.check{width:56px;height:56px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;margin:0 auto 12px;
  animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.check svg{width:28px;height:28px}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.done p{color:var(--muted);font-size:.95rem}
.preview{margin:16px 0;text-align:left;background:#f4fbfb;border:1px dashed var(--brand);border-radius:14px;padding:12px 14px;
  font-size:.9rem;color:var(--ink);white-space:pre-wrap;word-break:break-word}
.copied{color:var(--brand-dark);font-weight:600;font-size:.88rem;margin-bottom:14px}
.link{display:flex;align-items:center;gap:14px;text-align:left;border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;
  margin-top:10px;background:#fff;cursor:pointer;width:100%;font:inherit;color:var(--ink);transition:border-color .2s,transform .15s}
.link:hover{border-color:var(--brand)}
.link:active{transform:scale(.98)}
.link .ic{flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:1.25rem}
.g .ic{background:#4285f4}.f .ic{background:#1877f2}
.link b{display:block;font-size:1rem}
.link span.s{display:block;color:var(--muted);font-size:.85rem}
.back{background:none;border:0;color:var(--muted);font:inherit;font-size:.88rem;margin-top:16px;cursor:pointer;text-decoration:underline}
footer{text-align:center;color:var(--muted);font-size:.78rem;margin-top:22px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (prefers-color-scheme:dark){
  :root{--bg:#0b2a30;--card:#0f3a41;--ink:#e9fbfa;--muted:#9cc3c6;--line:#1b5560}
  body{background:linear-gradient(180deg,#0e3d44 0,var(--bg) 280px)}
  textarea,.link,.avatar{background:#0b2a30}
  .preview{background:#0b2a30}
  .stars button{color:#2c6670}.stars button.on{color:var(--star)}
}
</style>
</head>
<body>
<main class="wrap">

  <header class="hero">
    <div class="avatar" id="avatar"></div>
    <h1 id="docName"></h1>
    <div class="spec" id="docSpec"></div>
    <p class="lead">We'd love to hear about your experience ❤️</p>
  </header>

  <!-- Step 1: write -->
  <section class="card" id="step1">
    <h2 id="q"></h2>
    <div class="stars" id="stars" role="radiogroup" aria-label="Rating"></div>
    <label for="review" class="hidden">Your review</label>
    <textarea id="review" placeholder="Tell us about your experience..."></textarea>
    <div class="err" id="err" role="alert"></div>
    <button class="btn primary" id="continue">✨ Continue</button>
  </section>

  <!-- Step 2: share -->
  <section class="card done hidden" id="step2">
    <div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h2 style="margin-bottom:6px">Thank you for your feedback!</h2>
    <p>Your review is ready to share.</p>
    <div class="preview" id="preview"></div>
    <div class="copied" id="copied"></div>

    <button class="link g" id="gBtn">
      <span class="ic">G</span>
      <span><b>⭐ Google Review</b><span class="s">Share your experience on Google</span></span>
    </button>
    <button class="link f" id="fBtn">
      <span class="ic">f</span>
      <span><b>⭐ Facebook Review</b><span class="s">Share your experience on Facebook</span></span>
    </button>
    <p style="margin-top:14px;font-size:.85rem;color:var(--muted)">Your review is copied. Just <b>paste</b> it when the page opens.</p>
    <button class="back" id="back">Edit my review</button>
  </section>

  <footer>Thank you for trusting us with your smile 🦷</footer>
</main>

<script>
/* ============ EDIT ONLY THIS BLOCK ============ */
const CONFIG = {
  doctorName: "Dr. Kerolos Melad",
  specialty:  "Dentist · Cosmetic & Family Dentistry",
  photoUrl:   "Screenshot 2026-10-05 004519.png",   // e.g. "doctor.jpg" or a full image URL. Leave empty to show a tooth icon
  googleReviewLink:   "https://g.page/thumbaydentalhospital/review",
  facebookReviewLink: "https://www.facebook.com/profile.php?id=61581448780996&sk=reviews"
};
/* =============================================== */

const $ = id => document.getElementById(id);
const toothSvg = '<svg viewBox="0 0 64 64" fill="none" stroke="#14b8b0" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"><path d="M20 8c-7 0-12 5-12 13 0 6 3 10 4 16 1 6 2 19 7 19 4 0 4-12 7-12h4c3 0 3 12 7 12 5 0 6-13 7-19 1-6 4-10 4-16 0-8-5-13-12-13-4 0-6 2-9 2s-5-2-9-2z"/></svg>';

document.title = "Review " + CONFIG.doctorName;
$("docName").textContent = CONFIG.doctorName;
$("docSpec").textContent = CONFIG.specialty;
$("q").textContent = "How was your experience with " + CONFIG.doctorName + "?";
if (CONFIG.photoUrl) {
  const img = new Image();
  img.alt = CONFIG.doctorName;
  img.onerror = () => { $("avatar").innerHTML = toothSvg; };
  img.src = CONFIG.photoUrl;
  $("avatar").appendChild(img);
} else { $("avatar").innerHTML = toothSvg; }

/* Stars */
let rating = 5;
const starsEl = $("stars");
for (let i = 1; i <= 5; i++) {
  const b = document.createElement("button");
  b.type = "button"; b.textContent = "★";
  b.setAttribute("role", "radio");
  b.setAttribute("aria-label", i + " star" + (i > 1 ? "s" : ""));
  b.addEventListener("click", () => { rating = i; paint(); });
  starsEl.appendChild(b);
}
function paint(){
  [...starsEl.children].forEach((b, i) => {
    b.classList.toggle("on", i < rating);
    b.setAttribute("aria-checked", i + 1 === rating);
  });
}
paint();

/* Copy helper (works on modern + older mobile browsers) */
async function copyText(text){
  try { await navigator.clipboard.writeText(text); return true; } catch(e){}
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.cssText = "position:fixed;opacity:0";
  document.body.appendChild(ta); ta.focus(); ta.select();
  let ok = false;
  try { ok = document.execCommand("copy"); } catch(e){}
  ta.remove();
  return ok;
}

/* Step 1 -> Step 2 */
$("continue").addEventListener("click", async () => {
  const text = $("review").value.trim();
  if (text.length < 5) { $("err").textContent = "Please write a few words about your visit."; return; }
  $("err").textContent = "";
  $("preview").textContent = text;
  $("step1").classList.add("hidden");
  $("step2").classList.remove("hidden");
  window.scrollTo({top: 0, behavior: "smooth"});
  const ok = await copyText(text);
  $("copied").textContent = ok ? "✓ Copied to clipboard" : "Tap and hold the text above to copy it";
});

$("back").addEventListener("click", () => {
  $("step2").classList.add("hidden");
  $("step1").classList.remove("hidden");
});

/* Copy again right before opening each platform, then open it */
function share(url){
  const text = $("review").value.trim();
  copyText(text);                         // runs inside the tap, so the browser allows it
  window.open(url, "_blank", "noopener");
  $("copied").textContent = "✓ Copied. Paste it on the next page";
}
$("gBtn").addEventListener("click", () => share(CONFIG.googleReviewLink));
$("fBtn").addEventListener("click", () => share(CONFIG.facebookReviewLink));
</script>
</body>
</html>
